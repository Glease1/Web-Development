name: PHP

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: php-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -type f -name "*.php" -print0 | xargs -0 -r -n 1 php -l
